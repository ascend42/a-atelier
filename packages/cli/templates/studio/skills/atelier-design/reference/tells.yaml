# Atelier tells catalog: patterns that make design read as machine-made
# or templated. Luna writes options against it, Mika vets options and
# finish reviews with it, critique cites it, and `atelier check` runs the
# entries whose detect.kind is mechanical.
#
# A tell is a CHECK, never a ban. Any tell can be overridden for a brand
# or a scope; the override is recorded in design-system.yaml under
# `overrides:` with a reason and provenance, and is then respected
# everywhere (options, checks, critique, finish review).
#
# Fields
#   id        kebab-case, stable (referenced from design-system.yaml)
#   name      short label
#   scope     where it applies: landing | product | content
#   detect    kind: count | literal | pattern | structure | review
#               count     — a countable thing compared to a limit
#               literal   — a forbidden literal value
#               pattern   — a regex over source/copy
#               structure — page/section structure (needs a render or DOM read)
#               review    — judgement; agent-checked only
#             plus kind-specific args
#   why       why it reads as a tell (one line)
#   severity  warn | fail (default when no override exists)
#   override  when overriding is reasonable (guidance for Luna)
#
# Several entries adapt ideas from taste-skill (github.com/leonxlnx/taste-skill,
# MIT). The Motion (content) entries adapt findings from motionmaxxing
# (github.com/Tejashmakwana/motionmaxxing, Apache-2.0): its slop autopsy of
# rejected AI films and its measured launch-film motion. Detection, scope and
# override fields are Atelier's own; numbers are starting values from
# launch films (atelier-produce/reference/motion.md) and the brand cascade wins.

version: 1

tells:
  # ── Type ────────────────────────────────────────────────────────────
  - id: default-display-serif
    name: Default "editorial" serif
    scope: [landing, product]
    detect: { kind: literal, target: font.display, values: ["Fraunces", "Instrument Serif", "Playfair Display"] }
    why: The serifs models reach for whenever a brief says premium, creative or editorial; they stop signalling the brand.
    severity: warn
    override: The brand already uses it, or the creator picks it on a type-voice board knowing it's flagged.

  - id: default-neutral-sans
    name: Unchosen neutral sans
    scope: [landing]
    detect: { kind: review }
    why: Inter or system-ui used because nothing was decided, not because neutrality was the goal.
    severity: warn
    override: Neutral is the decision (utility, public sector, accessibility-first). Product UI is exempt by default.

  - id: mixed-family-emphasis
    name: Mixed-family emphasis
    scope: [landing, content]
    detect: { kind: review }
    why: One word swapped to a different family (serif italic inside a sans headline) as decoration.
    severity: warn
    override: The type system defines the swap as a deliberate, repeated device.

  - id: shouting-h1
    name: Hierarchy by size alone
    scope: [landing, product]
    detect: { kind: review }
    why: Huge headlines doing all the hierarchy work instead of weight, color and space.
    severity: warn
    override: Poster or manifesto pages where the headline is the design.

  # ── Color ───────────────────────────────────────────────────────────
  - id: pure-black
    name: Pure black
    scope: [landing, product, content]
    detect: { kind: literal, values: ["#000", "#000000", "rgb(0,0,0)"] }
    why: Flat, harsh against tinted neutrals; almost never what the palette intends.
    severity: warn
    override: High-contrast brutalist or OLED-dark systems that decide it explicitly.

  - id: default-warm-paper
    name: Default cream + brass palette
    scope: [landing, content]
    detect: { kind: review, hint: "warm cream/bone background with brass, clay, oxblood or ochre accent and espresso text" }
    why: The palette models give every premium-consumer brief, so the brand disappears into it.
    severity: warn
    override: The brand's real assets are in this family, or the creator picks it knowing it's flagged.

  - id: ai-glow-gradient
    name: Purple-blue glow gradient
    scope: [landing]
    detect: { kind: review }
    why: Neon purple/blue gradients and glows as decoration with no brand reason.
    severity: warn
    override: The brand color is purple/violet; then execute it with restraint.

  - id: accent-drift
    name: Accent drift
    scope: [landing, product]
    detect: { kind: count, what: "distinct accent hues outside tokens.color", max: 0 }
    why: A second accent appears in one section (a teal badge on a rose site).
    severity: fail
    override: Semantic colors (success/warning/danger) declared as tokens are not drift.

  - id: theme-flip
    name: Mid-page theme flip
    scope: [landing]
    detect: { kind: structure, what: "a section switches light/dark against the page theme" }
    why: Reads as two templates stitched together.
    severity: warn
    override: An intentional inverted band defined in the system (e.g. one dark proof section).

  # ── Shape ───────────────────────────────────────────────────────────
  - id: radius-drift
    name: Mixed corner radii
    scope: [landing, product]
    detect: { kind: count, what: "radius values not in tokens.radius", max: 0 }
    why: Pill buttons on square cards with 8px inputs, with no rule tying them together.
    severity: fail
    override: A documented per-component radius rule in the system.

  - id: tinted-shadow-missing
    name: Black drop shadows
    scope: [landing, product]
    detect: { kind: pattern, regex: "box-shadow:[^;]*rgba\\(0,\\s*0,\\s*0" }
    why: Grey-black shadows on tinted backgrounds look pasted on.
    severity: warn
    override: Neutral-grey systems where black is the background hue.

  # ── Layout ──────────────────────────────────────────────────────────
  - id: eyebrow-everywhere
    name: Eyebrow over every section
    scope: [landing]
    detect: { kind: count, what: "small uppercase tracked labels above section headlines", max: "ceil(sections / 3)" }
    why: The single most templated rhythm in generated pages.
    severity: fail
    override: Documentation or editorial index pages where labels carry real navigation.

  - id: three-equal-cards
    name: Three identical feature cards
    scope: [landing]
    detect: { kind: structure, what: "a row of 3 same-size cards with icon + title + blurb" }
    why: The default feature section; says nothing about which feature matters.
    severity: warn
    override: The three items are genuinely equal and the cards carry real content (not icon + blurb).

  - id: layout-family-repeat
    name: Repeated section layout
    scope: [landing]
    detect: { kind: structure, what: "the same section layout family used more than once" }
    why: Different sections that look the same make the page read as a template.
    severity: warn
    override: A repeated pattern that is the content model (e.g. case-study entries).

  - id: zigzag-run
    name: Zigzag run
    scope: [landing]
    detect: { kind: count, what: "consecutive alternating image/text split sections", max: 2 }
    why: Alternating left/right splits are the lowest-effort way to fill a page.
    severity: warn
    override: none

  - id: centered-hero-default
    name: Centered hero by default
    scope: [landing]
    detect: { kind: review }
    why: Centered headline over a gradient is the default when nothing about the brand was used.
    severity: warn
    override: Manifesto or launch pages where the message is the design; low layout dial.

  - id: hero-overloaded
    name: Overloaded hero
    scope: [landing]
    detect: { kind: count, what: "text elements in the hero (eyebrow, headline, subtext, CTA group, taglines, trust strips)", max: 4 }
    why: The hero becomes a feature list; nothing leads.
    severity: warn
    override: none

  - id: split-header
    name: Headline left, filler paragraph right
    scope: [landing]
    detect: { kind: review }
    why: A section header split into a big headline and a small floating explainer with no compositional reason.
    severity: warn
    override: The right column holds a visual or interactive element.

  - id: empty-bento-cell
    name: Padded bento grid
    scope: [landing, product]
    detect: { kind: structure, what: "grid cells without content, or more cells than items" }
    why: The grid was drawn before the content was counted.
    severity: fail
    override: none

  - id: fake-ui-screenshot
    name: Div-built fake product screenshot
    scope: [landing]
    detect: { kind: review }
    why: A fake dashboard made of grey rectangles signals there is no real product to show.
    severity: fail
    override: none. Use a real screenshot, a real component render, or nothing.

  # ── Copy & content ──────────────────────────────────────────────────
  - id: em-dash
    name: Em dash in UI copy
    scope: [landing, product, content]
    detect: { kind: pattern, regex: "—", where: "user-visible strings" }
    why: Heavy em-dash use is a widely recognized marker of generated copy.
    severity: warn
    override: The brand's editorial voice uses them; record it once.

  - id: duplicate-cta-intent
    name: One intent, many labels
    scope: [landing, product]
    detect: { kind: review, hint: "group CTAs by intent (contact, signup, demo, view work); one label per intent" }
    why: 'Get started, Try free and Sign up on one page read as three different things.'
    severity: fail
    override: none

  - id: cta-wraps
    name: Wrapping CTA label
    scope: [landing, product]
    detect: { kind: structure, what: "primary button label wraps at desktop width" }
    why: A two-line button looks broken.
    severity: fail
    override: none

  - id: placeholder-names
    name: Placeholder people and companies
    scope: [landing, product, content]
    detect: { kind: pattern, regex: "\\b(John|Jane) Doe\\b|\\bAcme\\b|Lorem ipsum" }
    why: Stock names and filler text in a reference or build make it read as a mockup.
    severity: fail
    override: none. Use the repo's real entities or realistic invented ones.

  - id: too-round-numbers
    name: Suspiciously round data
    scope: [landing, product]
    detect: { kind: review }
    why: 99.9%, 10x, 50% everywhere read as invented.
    severity: warn
    override: The numbers are real.

  - id: filler-verbs
    name: Filler marketing verbs
    scope: [landing, content]
    detect: { kind: pattern, regex: "\\b(elevate|seamless(ly)?|unleash|revolutioni[sz]e|supercharge|next-gen)\\b", flags: i }
    why: Verbs that could describe any product describe none.
    severity: warn
    override: none

  - id: numbered-section-labels
    name: Numbered section labels
    scope: [landing]
    detect: { kind: pattern, regex: "\\b0\\d\\s*[/·]\\s*[A-Z]" }
    why: '"01 / Capabilities" style enumeration as decoration.'
    severity: warn
    override: The content is a real sequence (steps the user follows).

  - id: decorative-meta
    name: Decorative meta strips
    scope: [landing]
    detect: { kind: review, hint: "version stamps, city/time/weather strips, 'scroll' cues, photo-credit captions on stock, status dots with no state" }
    why: Atmosphere props that carry no information.
    severity: warn
    override: The information is real and useful (a live status, a physical venue).

  # ── States & accessibility (product-heavy) ──────────────────────────
  - id: happy-path-only
    name: Happy path only
    scope: [product]
    detect: { kind: review, hint: "loading, empty, error, disabled and focus states for every data-bearing view" }
    why: Generated UI ships the success state and nothing else.
    severity: fail
    override: none

  - id: placeholder-as-label
    name: Placeholder as label
    scope: [product, landing]
    detect: { kind: structure, what: "inputs without a visible label" }
    why: Labels vanish on typing; fails accessibility.
    severity: fail
    override: none

  - id: contrast-fail
    name: Contrast below target
    scope: [landing, product, content]
    detect: { kind: structure, what: "text/background pairs below the system's contrast target (WCAG AA by default)" }
    why: Unreadable is not a style.
    severity: fail
    override: none

  - id: motion-unmotivated
    name: Unmotivated motion
    scope: [landing, product, content]
    detect: { kind: review, hint: "every animation explains a change or guides attention; prefers-reduced-motion honored" }
    why: Infinite loops and scroll-everything effects read as filler and hurt performance.
    severity: warn
    override: The motion dial is high and the creator chose it.

  # ── Systems & structure (playbook v1) ───────────────────────────────
  # From the Figma "Design basics" digest (2026-10-21), cross-checked against
  # NN/g and WCAG; see docs/playbook/proposals.md §Playbook v1.
  - id: card-soup
    name: Card soup
    scope: [product, landing]
    detect: { kind: structure, what: "groups wrapped in bordered or filled boxes where spacing alone would separate them (boxes inside boxes, every list item a card)" }
    why: When every group is a box, the box stops meaning anything; proximity should group first.
    severity: warn
    override: The container carries meaning (a draggable card, a selectable tile, a distinct surface).

  - id: accent-everywhere
    name: Accent everywhere
    scope: [product, landing]
    detect: { kind: count, what: "elements using the accent or another saturated hue in one view", max: "about a tenth of the view" }
    why: If most things are emphasised, nothing is; the accent stops pointing at the one thing.
    severity: warn
    override: An expressive brand surface (a campaign page) where colour is the content.

  - id: hue-only-contrast
    name: Contrast by hue alone
    scope: [product, landing, content]
    detect: { kind: structure, what: "text or meaningful marks whose colour differs from the background in hue but not in lightness (luminance ratio under 3:1), e.g. saturated complements" }
    why: Hue contrast isn't luminance contrast; it vibrates, fails WCAG and vanishes in grayscale.
    severity: fail
    override: none

  - id: soft-ui-low-contrast
    name: Soft UI
    scope: [product, landing]
    detect: { kind: review, hint: "neumorphic or embossed controls whose edges and states rely on faint shadows on a same-colour surface" }
    why: Controls dissolve into the surface; boundaries and states fail non-text contrast (WCAG 1.4.11).
    severity: warn
    override: Decorative elements that aren't controls.

  - id: near-miss-pairing
    name: Near-miss font pairing
    scope: [landing, product, content]
    detect: { kind: review, hint: "two families that are close but not the same (two geometric sans, two transitional serifs) used as a pairing" }
    why: Pairings work by clear contrast or one family in several weights; "almost the same" reads as a mistake.
    severity: warn
    override: The second family has a job the first can't do (tabular figures, a script for a wordmark).

  - id: ratio-as-reason
    name: The ratio as the reason
    scope: [landing, product, content]
    detect: { kind: review, hint: "a type or spacing scale, or a layout split, justified only by the golden ratio or another named proportion" }
    why: Named ratios are coarse for UI and much of the case for them is myth; the scale should come from the content and the base unit.
    severity: warn
    override: The ratio was tested against the real content and kept for that reason.

  - id: polish-as-validation
    name: Polish as validation
    scope: [product]
    detect: { kind: review, hint: "generated or high-fidelity UI accepted because it looks finished, with no record of the problem, what is known vs assumed, or how it was checked" }
    why: Finish makes untested ideas look decided (the aesthetic-usability effect works on reviewers too).
    severity: warn
    override: none

  - id: primitive-in-component
    name: Primitive token in a component
    scope: [product]
    detect: { kind: pattern, regex: "var\\(--(?:[a-z]+-)?(?:red|orange|yellow|green|teal|blue|indigo|purple|violet|pink|gray|grey|neutral|slate|zinc|stone)-?\\d{2,3}\\)", skip_definitions: true }
    why: Components that reach for a palette step (var(--gray-500)) skip the role layer, so themes and rebrands miss them.
    severity: warn
    override: The file defines the role tokens themselves.

  - id: hover-only-reveal
    name: Hover-only reveal
    scope: [product, landing]
    detect: { kind: review, hint: "actions, tooltips or previews that only appear on :hover, with no focus or tap path" }
    why: Touch has no hover and keyboards need focus; the feature doesn't exist for them.
    severity: fail
    override: none

  - id: disabled-without-reason
    name: Disabled without a reason
    scope: [product]
    detect: { kind: review, hint: "disabled controls with nothing nearby saying why or what would enable them" }
    why: A greyed-out button with no reason is a dead end.
    severity: warn
    override: The reason is obvious from the surrounding form (an empty required field highlighted).

  # ── Marks (brand) ───────────────────────────────────────────────────
  # From Allan Peters's practice in the neurons brain (design/branding);
  # checked in every round of the `brand` verb (reference/brand.md).
  - id: initial-only-mark
    name: The initial as the mark
    scope: [landing, product, content]
    detect: { kind: review, hint: "a brand mark that is just the name's first letter (or initials) set in the logotype's font, with no idea from the brand's strategy" }
    why: Simple, but not memorable, unique or ownable; it says nothing about the brand (PELUVA's P).
    severity: warn
    override: A monogram drawn as a real idea (letters combined or reshaped to carry the brand's story, like Golden Bear's G+B).

  - id: stock-symbol-mark
    name: Stock symbol
    scope: [landing, product, content]
    detect: { kind: review, hint: "a generic symbol any company in the category could use: a lightbulb for ideas, a globe for global, a rocket for growth, a leaf for green, a shield for security" }
    why: Fails "unique" and "ownable"; it marks the category, not the brand.
    severity: warn
    override: The symbol is combined or reshaped into something only this brand could own.

  - id: literal-add-on
    name: The literal add-on
    scope: [landing, product, content]
    detect: { kind: review, hint: "the subject pasted onto a logotype or mark as a separate drawing (a jet on top of 'JET', a fork beside a restaurant name)" }
    why: The obvious move; earning the image from the shapes already there (negative space, one detail) is what people remember.
    severity: warn
    override: none

  - id: illustration-as-mark
    name: Illustration as a mark
    scope: [landing, product, content]
    detect: { kind: review, hint: "a mark with fine detail, many colours, gradients or thin lines that turns to mush at 32px and 16px" }
    why: The mark has to serve the smallest media (favicon, avatar) first; detail belongs in large-media lockups.
    severity: warn
    override: The illustration is a large-media badge, and a reduced mark exists for small media.

  - id: abstract-orb-mark
    name: Abstract orb or sparkle
    scope: [landing, product, content]
    detect: { kind: review, hint: "a gradient orb, blob, swirl or four-point sparkle as the mark, with no subject from the brand" }
    why: The default mark generated tools and AI products reach for; it signals nothing about this brand.
    severity: warn
    override: The brand's own nouns really are light or energy and the form is drawn from them.

  # ── Motion (content) ────────────────────────────────────────────────
  # Video and motion graphics. `atelier render-check` computes the entries
  # marked render-check; the rest are judged on the render and its frames.
  - id: motion-page-chrome
    name: Page chrome on video
    scope: [content]
    detect: { kind: structure, what: "persistent corner/edge labels, tracked-caps tags, counters (\"02 / 05\"), timecodes, FPS/BPM text, corner brackets, progress bars or scene labels over a shot" }
    why: The strongest sign that nobody decided anything; the film reads as a slide deck that moves.
    severity: warn
    override: The overlay is real product UI being shown, or a series format the creator chose (an episode number on an intro card).

  - id: motion-deck-layout
    name: Deck layout in motion
    scope: [content]
    detect: { kind: review, hint: "held left-aligned headline block with media on the right, kicker above headline, title-then-content beats" }
    why: A web or slide layout animated is still a slide; nothing on screen performs the claim.
    severity: warn
    override: A deliberate typographic beat paced to speech.

  - id: motion-fade-everywhere
    name: Fade between every beat
    scope: [content]
    detect: { kind: review, hint: "opacity-only entries, or dissolves between most beats instead of moves, cuts or unmasks" }
    why: The default transition; real films mostly arrive by moving and cut on motion.
    severity: warn
    override: A calm brand or caption system that fades on purpose and records it (tokens.motion).

  - id: motion-grow-from-zero
    name: Grows from zero
    scope: [content]
    detect: { kind: review, hint: "logos, words, cards or cursors scaling up from 0 instead of decelerating in from oversize or from the edge" }
    why: Reads as a template transition, not an object arriving.
    severity: warn
    override: The growing thing becomes the next scene, or items in a fast cascade.

  - id: motion-bounce-everywhere
    name: Overshoot on everything
    scope: [content]
    detect: { kind: review, hint: "springs or back-eases on most moves; more than one visible spring in a film" }
    why: Under a tenth of real moves overshoot, and late; a bounce on everything is the AI default.
    severity: warn
    override: A playful brand that records a springy motion token.

  - id: motion-dead-frames
    name: Dead frames
    scope: [content]
    detect: { kind: count, what: "runs of more than 3 consecutive frozen frames not declared as a designed breath (atelier render-check)", max: 0 }
    why: A locked frame reads as a slide; a held frame should keep one living thing on it.
    severity: warn
    override: A designed breath (0.6-1.5 s) before a payoff, stated in the storyboard and passed to the check with --allow-hold.

  - id: motion-long-end-hold
    name: Long end hold or web-footer ending
    scope: [content]
    detect: { kind: count, what: "seconds the final picture holds unchanged (atelier render-check); or logo + tagline + button + URL as the ending", max: 1.4 }
    why: The film ends like a website footer and outstays its idea.
    severity: warn
    override: A platform end-screen zone the platform requires (YouTube end screen), recorded in the kit.

  - id: motion-flat-swatch-grounds
    name: Flat swatch grounds
    scope: [content]
    detect: { kind: review, hint: "a flat colour per scene, or a small card on an empty void, instead of a ground with light, depth or texture" }
    why: Swatches change per scene to fake variety; nothing is built.
    severity: warn
    override: A flat brand, or a colour flood under about a second.

  - id: motion-pinned-object
    name: Pinned object across shots
    scope: [content]
    detect: { kind: review, hint: "the same pill, dock or label at the same coordinates through three or more shots" }
    why: A carrier that never travels reads as a HUD, not a story.
    severity: warn
    override: A persistent element the format requires (a live caption band, a watermark the platform needs).

  - id: motion-uniform-stagger
    name: Uniform timer stagger
    scope: [content]
    detect: { kind: review, hint: "siblings start at an identical fixed interval, each finishing before the next starts" }
    why: Reads as a loading list; real staggers are uneven and overlap.
    severity: warn
    override: A deliberately mechanical register the brand records.
