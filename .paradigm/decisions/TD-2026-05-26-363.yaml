title: Content-gen agents Quill/Lux/Iris ship with Atelier as a Claude Code skill
decision: >-
  Instantiate Quill (Showrunner), Lux (Cinematographer), and Iris (Composer) as concrete personas living with Atelier
  and packaged as a self-contained Atelier Claude Code skill/plugin — not in a-paradigm. Populate the empty
  .paradigm/personas/index.yaml; keep their design lineage in lore but make their home Atelier.
rationale: >-
  This is the load-bearing decision for the 'edit nothing, just talk' experience. Mirrors how Hyperframes distributes (a
  Claude Code skill), gives a UGC creator one install, and puts the orchestrating agents next to the engine they drive.
  Atelier University already teaches this flow (ATEL-501/601/701/801).
