    decision: Import AnimatablePropertySchema from @atelier/schema into MCP tools instead of maintaining local copies
    rationale: Prevents sync bugs when adding 8+ new animatable properties — single source of truth
  - id: frameIndex-at-visual-level
    decision: Place frameIndex on ImageVisual (not inside spritesheet config)
    rationale: frameIndex is the runtime-animated value, following the motionPath/progress pattern
  - id: tint-on-layer
    decision: Place tint on Layer (not ImageVisual) so any visual type can be tinted
    rationale: Follows the same pattern as shadow — layer-level effects apply to all visual types
