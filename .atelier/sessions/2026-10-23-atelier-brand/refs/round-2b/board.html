<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>draft</title><style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1b1c1e;--muted:#5d6066;--line:#e3e3df;--warn:#9a5b00;--warn-bg:#fff4e0;--ok:#1f6b3a;--ok-bg:#e6f4ea;--accent:#2b59c3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141518;--panel:#1c1d21;--ink:#ececea;--muted:#a3a6ad;--line:#2e3036;--warn:#f0b35a;--warn-bg:#3a2a12;--ok:#7fd29a;--ok-bg:#163222;--accent:#8fb0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141518;--panel:#1c1d21;--ink:#ececea;--muted:#a3a6ad;--line:#2e3036;--warn:#f0b35a;--warn-bg:#3a2a12;--ok:#7fd29a;--ok-bg:#163222;--accent:#8fb0ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1120px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:28px;line-height:1.2;margin:0 0 4px}
h2{font-size:19px;margin:40px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
h3{font-size:15px;margin:20px 0 8px}
p,li{max-width:72ch}
.meta{color:var(--muted);font-size:13px}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.swatch{height:56px;border-radius:6px;border:1px solid var(--line);margin-bottom:8px;background-image:linear-gradient(var(--c),var(--c)),conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0);background-size:auto,12px 12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.off{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.bar{height:12px;background:var(--accent);border-radius:2px}
.where{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.callout{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:12px 14px;margin:12px 0}
iframe{width:100%;border:1px solid var(--line);border-radius:6px;background:transparent;height:72px;display:block}
nav.toc{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin-top:12px}
nav.toc a{color:var(--accent)}
.theme-toggle{position:fixed;top:12px;right:12px;font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
</style></head><body><button class="theme-toggle" type="button" onclick="(function(r){var d=r.getAttribute('data-theme');var dark=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')})(document.documentElement)">Theme</button><main><style>
.opt{display:flex;flex-direction:column;gap:10px}
.opt .big{aspect-ratio:1;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12%}
.opt .big img{max-width:100%;max-height:100%}
.sizes{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.chip{display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);padding:6px}
.chip.light{background:#fff}.chip.dark{background:#111}.chip.dark img{filter:brightness(0) invert(1)}
.mono img{filter:grayscale(1) contrast(1.4)}
.label{font-size:20px;font-weight:700}
.chart{display:grid;grid-template-columns:auto 1fr auto;gap:0 16px;align-items:stretch}
.axis{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding:0 4px}
.lockups{display:flex;flex-direction:column;gap:0}
.lockup{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.lockup .art{background:#fff;border-radius:8px;padding:16px;display:grid;place-items:center;min-height:96px}
.lockup .art img{max-height:120px;max-width:100%}
</style><h1>draft</h1><p class="meta">3 options. Each is shown large, at 64, 32 and 16 px, on dark and in one colour, because a mark has to hold up where it will really be used. Reply with the letters you want developed, and any notes.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:20px"><div class="card opt"><div class="row"><span class="label">A</span><span class="meta mono-name">a1-drawing-the-circle.svg</span></div><div class="big"><img src="a1-drawing-the-circle.svg" alt="Option A"></div><div class="sizes"><div class="chip light"><img src="a1-drawing-the-circle.svg" alt="Option A at 64px" style="height:64px;width:auto"></div><div class="chip light"><img src="a1-drawing-the-circle.svg" alt="Option A at 32px" style="height:32px;width:auto"></div><div class="chip light"><img src="a1-drawing-the-circle.svg" alt="Option A at 16px" style="height:16px;width:auto"></div><div class="chip dark"><img src="a1-drawing-the-circle.svg" alt="Option A reversed on dark" style="height:32px;width:auto"></div><div class="chip light mono"><img src="a1-drawing-the-circle.svg" alt="Option A in one colour" style="height:32px;width:auto"></div></div></div><div class="card opt"><div class="row"><span class="label">B</span><span class="meta mono-name">a2-refined.svg</span></div><div class="big"><img src="a2-refined.svg" alt="Option B"></div><div class="sizes"><div class="chip light"><img src="a2-refined.svg" alt="Option B at 64px" style="height:64px;width:auto"></div><div class="chip light"><img src="a2-refined.svg" alt="Option B at 32px" style="height:32px;width:auto"></div><div class="chip light"><img src="a2-refined.svg" alt="Option B at 16px" style="height:16px;width:auto"></div><div class="chip dark"><img src="a2-refined.svg" alt="Option B reversed on dark" style="height:32px;width:auto"></div><div class="chip light mono"><img src="a2-refined.svg" alt="Option B in one colour" style="height:32px;width:auto"></div></div></div><div class="card opt"><div class="row"><span class="label">C</span><span class="meta mono-name">a3-circle-crossbar.svg</span></div><div class="big"><img src="a3-circle-crossbar.svg" alt="Option C"></div><div class="sizes"><div class="chip light"><img src="a3-circle-crossbar.svg" alt="Option C at 64px" style="height:64px;width:auto"></div><div class="chip light"><img src="a3-circle-crossbar.svg" alt="Option C at 32px" style="height:32px;width:auto"></div><div class="chip light"><img src="a3-circle-crossbar.svg" alt="Option C at 16px" style="height:16px;width:auto"></div><div class="chip dark"><img src="a3-circle-crossbar.svg" alt="Option C reversed on dark" style="height:32px;width:auto"></div><div class="chip light mono"><img src="a3-circle-crossbar.svg" alt="Option C in one colour" style="height:32px;width:auto"></div></div></div></div></main></body></html>
