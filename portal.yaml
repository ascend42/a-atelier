version: '1.0'
gates:
  no-overlap:
    description: Rejects delta additions that overlap with existing deltas on the same layer+property
    type: validation
    location: packages/core/src/builder/document-builder.ts
    prizes: []
  valid-document:
    description: Validates that an AtelierDocument conforms to the schema — required fields, type constraints, and structural integrity
    type: validation
    location: packages/schema
    prizes: []
  valid-delta:
    description: Validates that a Delta object conforms to the schema — property types, value ranges, and easing references
    type: validation
    location: packages/schema
    prizes: []
  valid-video-layer:
    description: Validates a VideoVisual layer — sourceEnd > sourceOffset, sourceEnd ≤ videoMeta.duration if present, assetId non-empty
    type: validation
    location: packages/schema/src/validate.ts
    prizes: []
  valid-recipe:
    description: Validates a StudioRecipe against the schema — Phase 1 fields strict, Phase 3 reserved fields parsed opaque with warnings
    type: validation
    location: packages/schema/src/validate.ts
    prizes: []
  localhost-only:
    description: 'atelier studio dev server is bound to 127.0.0.1 only (not 0.0.0.0) and rejects POST/PUT/DELETE/PATCH on /api/* whose Origin header is not http://localhost:<port> or http://127.0.0.1:<port> — prevents cross-site browser tabs from writing .atelier files in the user''s CWD.'
    type: security
    location: packages/cli/src/commands/studio.ts
    prizes: []
routes: {}
